<!DOCTYPE html>
<html>
<html lang="en">
<head>
  <title>My First Website</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ziya's GitHub Websites</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Hello! I am Ziya 👋</h1>
  <p>This is my first website on GitHub.</p>
  <main class="container">
    <h1>Ziya's Website Hub 🌐</h1>
    <p class="intro">
      This page automatically shows GitHub Pages websites from my GitHub account.
    </p>

    <section class="card">
      <h2>My Websites</h2>
      <p id="status">Loading websites...</p>
      <ul id="website-list"></ul>
    </section>
  </main>

  <script>
    const username = "ziya123";
    const list = document.getElementById("website-list");
    const status = document.getElementById("status");

    async function loadWebsites() {
      try {
        const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);
        if (!response.ok) {
          throw new Error("Could not load repositories from GitHub API.");
        }

        const repos = await response.json();

        const pagesRepos = repos.filter((repo) =>
          repo.homepage || repo.name.endsWith(".github.io")
        );

        if (pagesRepos.length === 0) {
          status.textContent = "No GitHub websites found yet.";
          return;
        }

        status.textContent = `Found ${pagesRepos.length} website${pagesRepos.length > 1 ? "s" : ""}.`;

        pagesRepos.forEach((repo) => {
          const item = document.createElement("li");
          const link = document.createElement("a");

          const websiteUrl = repo.homepage || `https://${username}.github.io/${repo.name.replace(".github.io", "")}`;

          link.href = websiteUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = `${repo.name} → ${websiteUrl}`;

          item.appendChild(link);
          list.appendChild(item);
        });
      } catch (error) {
        status.textContent = "Sorry, I could not load your websites right now.";
        console.error(error);
      }
    }

    loadWebsites();
  </script>
</body>
</html >
</html>
